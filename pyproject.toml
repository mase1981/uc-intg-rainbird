[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-intg-rainbird"
version = "1.0.0"
description = "Rain Bird irrigation controller integration for Unfolded Circle Remote Two/3"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MPL-2.0"}
authors = [
    {name = "Meir Miyara", email = "meir.miyara@gmail.com"}
]
keywords = ["rainbird", "rain-bird", "irrigation", "sprinkler", "lnk", "unfolded-circle", "remote", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "ucapi>=0.7.0",
    "ucapi-framework>=1.9.5",
    "aiohttp>=3.9.0",
    "pyrainbird==6.0.2",
]

[project.urls]
"Homepage" = "https://github.com/mase1981/uc-intg-rainbird"
"Bug Reports" = "https://github.com/mase1981/uc-intg-rainbird/issues"
"Source" = "https://github.com/mase1981/uc-intg-rainbird"

[project.scripts]
uc-intg-rainbird = "uc_intg_rainbird:main"

[tool.setuptools.packages.find]
include = ["uc_intg_rainbird*"]

[tool.setuptools.package-data]
uc_intg_rainbird = ["*.json"]
